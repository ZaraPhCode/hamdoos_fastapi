version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ashauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashapass}
      POSTGRES_DB: ${POSTGRES_DB:-ashadb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashauser -d ashadb"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: asha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ashauser:ashapass@db:5432/ashadb
    volumes:
      - ./app:/app/app/
      - ./alembic:/app/alembic
      - ../asha-shop/ASHA.Shop.Presentation/wwwroot/Media:/app/media

volumes:
  postgres_data: