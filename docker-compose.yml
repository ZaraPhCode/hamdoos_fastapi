version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER:-ashauser}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashapass}
    #   POSTGRES_DB: ${POSTGRES_DB:-ashadb}
    env_file:
      - /opt/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: asha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - /opt/.env
    # environment:
    #   - POSTGRES_USER=${POSTGRES_USER:-ashauser}
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ashapass}
    #   - POSTGRES_DB=${POSTGRES_DB:-ashadb}
    #   - POSTGRES_HOST=db
    #   - POSTGRES_PORT=5432
    volumes:
      - ./app:/app/app/
      - ./alembic:/app/alembic
      - ../asha-shop/ASHA.Shop.Presentation/wwwroot/Media:/app/media

  nginx:
    image: nginx:alpine
    container_name: asha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/static:/app/app/static:ro
      - ./deploy/ssl:/etc/ssl/certs

volumes:
  postgres_data: