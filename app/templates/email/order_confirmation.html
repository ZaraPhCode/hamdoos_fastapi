<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head><meta charset="UTF-8"><title>تأیید سفارش - آشا شاپ</title></head>
<body style="font-family:Tahoma,Arial,sans-serif;background:#f4f4f4;padding:20px;">
    <div style="max-width:600px;margin:auto;background:white;border-radius:8px;overflow:hidden;">
        <div style="background:#4F46E5;padding:20px;text-align:center;">
            <h1 style="color:white;margin:0;font-size:20px;">آشا شاپ</h1>
        </div>
        <div style="padding:30px;">
            <h2 style="margin-top:0;">سفارش شما ثبت شد</h2>
            <p>کاربر گرامی {{ full_name }}، سفارش شما با موفقیت ثبت شد.</p>
            <table style="width:100%;border-collapse:collapse;margin:20px 0;">
                <tr><td style="padding:8px;border:1px solid #ddd;">شماره سفارش</td><td style="padding:8px;border:1px solid #ddd;font-weight:bold;">{{ reference_code }}</td></tr>
                <tr><td style="padding:8px;border:1px solid #ddd;">مبلغ قابل پرداخت</td><td style="padding:8px;border:1px solid #ddd;font-weight:bold;">{{ "{:,.0f}".format(total_price) }} تومان</td></tr>
                <tr><td style="padding:8px;border:1px solid #ddd;">تاریخ</td><td style="padding:8px;border:1px solid #ddd;">{{ order_date }}</td></tr>
            </table>
            <p style="text-align:center;margin-top:30px;">
                <a href="{{ site_url }}/orders/{{ order_id }}" style="background:#4F46E5;color:white;padding:10px 20px;border-radius:5px;text-decoration:none;">پیگیری سفارش</a>
            </p>
        </div>
        <div style="background:#f9f9f9;padding:15px;text-align:center;font-size:12px;color:#888;">
            &copy; 2026 آشا شاپ
        </div>
    </div>
</body>
</html>
