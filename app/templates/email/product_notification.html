<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head><meta charset="UTF-8"><title>محصول موجود شد - آشا شاپ</title></head>
<body style="font-family:Tahoma,Arial,sans-serif;background:#f4f4f4;padding:20px;">
    <div style="max-width:600px;margin:auto;background:white;border-radius:8px;overflow:hidden;">
        <div style="background:#4F46E5;padding:20px;text-align:center;">
            <h1 style="color:white;margin:0;font-size:20px;">محصول موجود شد</h1>
        </div>
        <div style="padding:30px;">
            <p>کاربر گرامی {{ full_name }}،</p>
            <p>محصول "<strong>{{ product_name }}</strong>" که قبلاً به آن علاقه نشان داده بودید، اکنون موجود شد.</p>
            {% if product_url %}
            <p style="text-align:center;margin-top:20px;">
                <a href="{{ product_url }}" style="background:#4F46E5;color:white;padding:10px 20px;border-radius:5px;text-decoration:none;">مشاهده محصول</a>
            </p>
            {% endif %}
        </div>
    </div>
</body>
</html>
