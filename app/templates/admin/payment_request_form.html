{% extends "admin/base.html" %}
{% block title %}{{ "ویرایش پرداخت" if pr else "پرداخت جدید" }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">{{ "ویرایش پرداخت" if pr else "پرداخت جدید" }}</h1>
        <a href="{{ '/administration/payment-requests/' ~ pr.id if pr else '/administration/orders/' ~ order.id }}" class="btn-secondary flex items-center gap-2">
            <i class="fas fa-arrow-right"></i> بازگشت
        </a>
    </div>

    <form method="POST" action="{{ '/administration/payment-requests/' ~ pr.id ~ '/edit' if pr else '/administration/payment-requests/create' }}" class="space-y-6">
        {% if order %}
        <input type="hidden" name="order_id" value="{{ order.id }}">
        {% endif %}

        <div class="card">
            <div class="card-header"><h2 class="text-lg font-semibold">مشخصات پرداخت</h2></div>
            <div class="card-body grid grid-cols-1 md:grid-cols-2 gap-4">
                {% if order %}
                <div>
                    <label class="form-label">سفارش</label>
                    <input type="text" value="سفارش #{{ order.reference_code or order.id[:8] }}" class="form-input" disabled>
                </div>
                {% endif %}
                <div>
                    <label class="form-label" for="amount">مبلغ <span class="text-red-500">*</span></label>
                    <input type="number" id="amount" name="amount" min="0" step="0.01" value="{{ pr.amount if pr and pr.amount is not none else (order.payable if order else 0) }}" class="form-input" required>
                </div>
                <div>
                    <label class="form-label" for="status">وضعیت</label>
                    <select id="status" name="status" class="form-input">
                        {% for value, name in payment_status_names.items() %}
                        <option value="{{ value }}" {{ 'selected' if (pr and pr.status == value) or (not pr and default_status == value) else '' }}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="btn-primary flex items-center gap-2"><i class="fas fa-save"></i> ذخیره</button>
            <a href="{{ 'javascript:history.back()' }}" class="btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
