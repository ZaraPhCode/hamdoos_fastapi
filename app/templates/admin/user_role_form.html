{% extends "admin/base.html" %}
{% block title %}{{ "ویرایش انتساب" if ur else "انتساب جدید" }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 border-r-4 border-teal-500">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-500 to-cyan-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-teal-200"><i class="fas fa-user-tag"></i></div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">{{ "ویرایش انتساب نقش" if ur else "انتساب نقش جدید" }}</h1>
                </div>
            </div>
            <a href="/administration/user-roles" class="btn-secondary flex items-center gap-2"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ '/administration/user-roles/' ~ ur.id ~ '/edit' if ur else '/administration/user-roles/new' }}" class="space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gradient-to-r from-teal-50 to-cyan-50 border-b border-gray-200 px-6 py-4">
                <h2 class="font-semibold text-gray-800">انتخاب کاربر و نقش</h2>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                    <div>
                        <label class="form-label">کاربر <span class="text-red-500">*</span></label>
                        <select name="user_id" class="form-input" required>
                            <option value="">انتخاب کاربر</option>
                            {% for u in users %}
                            <option value="{{ u.id }}" {{ 'selected' if ur and ur.user_id == u.id else '' }}>{{ u.full_name or u.user_name }} ({{ u.phone_number or u.email or '' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="form-label">نقش <span class="text-red-500">*</span></label>
                        <select name="role_id" class="form-input" required>
                            <option value="">انتخاب نقش</option>
                            {% for r in roles %}
                            <option value="{{ r.id }}" {{ 'selected' if ur and ur.role_id == r.id else '' }}>{{ r.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <a href="/administration/user-roles" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-gray-300 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-colors"><i class="fas fa-times"></i> انصراف</a>
                    <button type="submit" class="btn-success flex items-center gap-2 px-6 py-2.5"><i class="fas fa-check"></i> {{ "بروزرسانی" if ur else "ذخیره" }}</button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
