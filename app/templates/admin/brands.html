?{% extends "admin/base.html" %}
{% block title %}برندها{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">مدیریت برندها</h1>
        <a href="/administration/brands/create" class="btn-primary flex items-center gap-2">
            <i class="fas fa-plus"></i> برند جدید
        </a>
    </div>
    <div class="card">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="table-header">#</th>
                        <th class="table-header">نام برند</th>
                        <th class="table-header">تعداد محصولات</th>
                        <th class="table-header">عملیات</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for brand in brands %}
                    <tr class="table-row-hover">
                        <td class="table-cell">{{ brand.id }}</td>
                        <td class="table-cell font-medium">{{ brand.name }}</td>
                        <td class="table-cell">{{ brand.product_count or 0 }}</td>
                        <td class="table-cell">
                            <div class="flex items-center gap-2">
                                <a href="/administration/brands/{{ brand.id }}/edit" class="text-blue-600 hover:text-blue-800" title="ویرایش">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form method="POST" action="/administration/brands/{{ brand.id }}/delete" onsubmit="return confirm('آیا از حذف برند {{ brand.name }} اطمینان دارید؟')" style="display:inline">
                                    <button type="submit" class="text-red-500 hover:text-red-700" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">هیچ برندی یافت نشد.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
