{% extends "admin/base.html" %}
{% block title %}ایجاد فیش پرداخت{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">ایجاد فیش پرداخت</h1>
        <a href="/administration/orders/{{ order.id }}" class="btn-secondary flex items-center gap-2"><i class="fas fa-arrow-right"></i> بازگشت به سفارش</a>
    </div>

    <form method="POST" action="/administration/receipts/create" class="space-y-6">
        <input type="hidden" name="order_id" value="{{ order.id }}">

        <div class="card">
            <div class="card-header"><h2 class="text-lg font-semibold">مشخصات فیش</h2></div>
            <div class="card-body grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="form-label">سفارش</label>
                    <input type="text" value="سفارش #{{ order.reference_code or (order.id|short_id) }}" class="form-input" disabled>
                </div>
                <div>
                    <label class="form-label" for="user_id">کاربر</label>
                    <select id="user_id" name="user_id" class="form-input">
                        <option value="">-- انتخاب کاربر --</option>
                        {% for u in users %}
                        <option value="{{ u.id }}" {{ 'selected' if order.user_id == u.id|string else '' }}>{{ u.full_name }} ({{ u.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="form-label" for="price">مبلغ <span class="text-red-500">*</span></label>
                    <input type="number" id="price" name="price" min="0" step="0.01" value="{{ order.payable }}" class="form-input" required>
                </div>
                <div>
                    <label class="form-label" for="destination_bank">بانک مقصد</label>
                    <input type="text" id="destination_bank" name="destination_bank" class="form-input">
                </div>
                <div>
                    <label class="form-label" for="reference_code">کد مرجع</label>
                    <input type="text" id="reference_code" name="reference_code" class="form-input" dir="ltr" value="{{ order.reference_code }}">
                </div>
                <div class="md:col-span-2">
                    <label class="form-label" for="description">توضیحات</label>
                    <textarea id="description" name="description" rows="3" class="form-input"></textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="btn-primary flex items-center gap-2"><i class="fas fa-save"></i> ذخیره</button>
            <a href="/administration/orders/{{ order.id }}" class="btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
