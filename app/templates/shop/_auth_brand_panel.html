<aside class="asha-auth-brand" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb-glow"></div>
        <div class="asha-auth-brand-inner">
        <div class="asha-auth-brand-head">
            <div>
                <div class="asha-auth-brand-name">{{ site_brand.name }}</div>
                <div class="asha-auth-brand-sub">{{ site_brand.tagline }}</div>
            </div>
        </div>
            <h2 class="asha-auth-brand-title">{{ site_brand.headline }}</h2>
            <p class="asha-auth-brand-desc">{{ site_brand.description }}</p>
            <ul class="asha-auth-features">
                {%- for feature in site_brand.features %}
                <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>{{ feature }}</li>
                {%- endfor %}
            </ul>
        </div>
    </aside>
