<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}ورود | {{ site_brand.name }}{% endblock %}</title>
    <meta name="description" content="ورود به حساب کاربری {{ site_brand.headline }} {{ site_brand.name }}">
    <link rel="icon" type="image/png" href="{{ site_brand.favicon_url }}">
    <link rel="stylesheet" href="/static/ThemeLayout/vazirmatn.css" type="text/css" media="all">
    <link rel="stylesheet" href="/static/css/auth.css" type="text/css" media="all">
{% include "shop/_theme_vars.html" -%}
    {% block extra_head %}{% endblock %}
</head>
<body class="asha-auth-body">
<div class="asha-auth">
    {% include "shop/_auth_brand_panel.html" %}
    <main class="asha-auth-main">
        <div class="asha-auth-cardwrap">
            {% block content %}{% endblock %}
            <p class="asha-support">نیاز به راهنمایی دارید؟ با <a href="{{ site_brand.support_phone_href }}">{{ site_brand.support_phone }}</a> در تماس باشید.</p>
        </div>
    </main>
</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
