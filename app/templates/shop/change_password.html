{% extends "shop/base.html" %}
{% block title %}تغییر رمز عبور - آشا شاپ{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-sm border p-6">
        <h1 class="text-xl font-bold mb-6">تغییر رمز عبور</h1>
        {% if success %}<div class="bg-green-100 text-green-700 p-3 rounded-lg mb-4 text-sm">{{ success }}</div>{% endif %}
        {% if error %}<div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>{% endif %}
        <form method="POST" class="space-y-4">
            <div><label class="block text-sm mb-1">رمز عبور فعلی</label><input name="current_password" type="password" required class="w-full border rounded-lg px-3 py-2"></div>
            <div><label class="block text-sm mb-1">رمز عبور جدید</label><input name="new_password" type="password" required class="w-full border rounded-lg px-3 py-2"></div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700">تغییر رمز عبور</button>
        </form>
    </div>
</div>
{% endblock %}
