{% extends "shop/base.html" %}
{% block title %}نتایج جستجو - آشا شاپ{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-4">نتایج جستجو{% if query %}: "{{ query }}"{% endif %}</h1>
<div id="search-results" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
<div id="no-results" class="hidden text-center py-16 text-gray-400">
    <i class="fas fa-search text-5xl mb-4"></i>
    <p>نتیجه‌ای برای "{{ query }}" یافت نشد</p>
</div>
<div id="pagination" class="flex justify-center mt-6 gap-2"></div>
<script>
const query = "{{ query|escapejs }}";
let page = 1;
async function loadSearch(p) {
    const r = await fetch(`/api/v1/products?query=${encodeURIComponent(query)}&page=${p}&page_size=20`);
    const data = await r.json();
    const container = document.getElementById('search-results');
    const noResults = document.getElementById('no-results');
    const pagination = document.getElementById('pagination');
    container.innerHTML = '';
    pagination.innerHTML = '';
    if(!data.items || !data.items.length) { noResults.classList.remove('hidden'); return; }
    noResults.classList.add('hidden');
    data.items.forEach(p => {
        container.innerHTML += `<div class="bg-white rounded-lg shadow-sm border p-3">
            <a href="/products/${p.slug||p.id}">
                <img src="${p.medium_image_url||'/static/img/placeholder.png'}" class="w-full h-32 object-contain mb-2">
                <p class="text-sm line-clamp-2">${p.name}</p>
                <p class="text-indigo-600 font-bold mt-1">${(p.price_after_discount||p.price||0).toLocaleString()} تومان</p>
            </a></div>`;
    });
    page = p;
    if(data.total_pages > 1) {
        if(p>1) pagination.innerHTML += `<button onclick="loadSearch(${p-1})" class="px-3 py-1 border rounded text-sm">قبلی</button>`;
        pagination.innerHTML += `<span class="px-3 py-1 text-sm">${p}/${data.total_pages}</span>`;
        if(p<data.total_pages) pagination.innerHTML += `<button onclick="loadSearch(${p+1})" class="px-3 py-1 border rounded text-sm">بعدی</button>`;
    }
}
loadSearch(1);
</script>
{% endblock %}
