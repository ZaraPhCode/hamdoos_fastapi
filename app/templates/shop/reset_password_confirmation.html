{% extends "shop/auth_base.html" %}
{% block title %}تغییر رمز عبور | {{ site_brand.name }}{% endblock %}

{% block content %}
<div class="asha-card">
    <div class="asha-card-head">
        <span class="asha-auth-logo-badge"><img src="{{ site_brand.logo_url }}" alt="{{ site_brand.name }}"></span>
        <h1 class="asha-card-title">رمز عبور تغییر کرد</h1>
        <p class="asha-card-sub">رمز عبور شما با موفقیت تغییر کرد</p>
    </div>
    <a class="asha-btn" style="display: block; text-decoration: none; text-align: center;" href="{{ login_url }}">ورود</a>
</div>
{% endblock %}
