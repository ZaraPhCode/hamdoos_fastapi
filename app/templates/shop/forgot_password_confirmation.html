{% extends "shop/auth_base.html" %}
{% block title %}ایمیل بازیابی ارسال شد | {{ site_brand.name }}{% endblock %}

{% block content %}
<div class="asha-card">
    <div class="asha-card-head">
        <span class="asha-auth-logo-badge"><img src="{{ site_brand.logo_url }}" alt="{{ site_brand.name }}"></span>
        <h1 class="asha-card-title">ایمیل بازیابی ارسال شد</h1>
        <p class="asha-card-sub">لطفا صندوق ایمیل خود را بررسی کنید</p>
    </div>
    <div class="asha-notice">
        <span>لینک بازیابی رمز عبور برای شما ارسال شد. لینک داخل ایمیل را باز کنید.</span>
    </div>
    <p class="asha-foot"><a class="asha-link" href="/login">بازگشت به ورود</a></p>
</div>
{% endblock %}
