server {
    listen 80;
    server_name beta.hamdoos.ir;

    # ArvanCloud orange cloud is off: origin now terminates TLS itself.
    # Plain HTTP is redirected to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beta.hamdoos.ir;

    ssl_certificate     /etc/ssl/certs/asha-shop.crt;
    ssl_certificate_key /etc/ssl/certs/asha-shop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location /static/ {
        alias /app/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /sitemap.xml {
        proxy_pass http://app:8000/sitemap.xml;
    }

    location = /robots.txt {
        proxy_pass http://app:8000/robots.txt;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    access_log /var/log/nginx/beta-hamdoos-access.log;
    error_log /var/log/nginx/beta-hamdoos-error.log;
}