server {
    listen 80;
    server_name beta.hamdoos.ir;

    client_max_body_size 50M;

    # TLS is terminated at the ArvanCloud edge (orange cloud). This origin
    # accepts plain HTTP on :80 and Arvan forwards requests here.

    location /static/ {
        alias /app/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /sitemap.xml {
        proxy_pass http://app:8000/sitemap.xml;
    }

    location = /robots.txt {
        proxy_pass http://app:8000/robots.txt;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    access_log /var/log/nginx/beta-hamdoos-access.log;
    error_log /var/log/nginx/beta-hamdoos-error.log;
}