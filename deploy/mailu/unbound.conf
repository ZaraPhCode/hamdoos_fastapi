# Mailu unbound template override (stock Mailu 2.0 template + forward-zone).
# Our provider blocks direct DNS recursion from the VPS, so unbound forwards
# to the provider resolvers. Unbound still validates DNSSEC itself
# (validator module + auto trust anchor), which is what Mailu requires.
server:
  verbosity: 1
  interface: 0.0.0.0
{{- '  interface: ::0' if SUBNET6 }}
  logfile: ""
  do-ip4: yes
  do-ip6: {{ 'yes' if SUBNET6 else 'no' }}
  do-udp: yes
  do-tcp: yes
  do-daemonize: no
  access-control: {{ SUBNET }} allow
{%- if SUBNET6 %}
  access-control: {{ SUBNET6 }} allow
{%- endif %}
  directory: "/etc/unbound"
  username: unbound
  auto-trust-anchor-file: trusted-key.key
  root-hints: "/etc/unbound/root.hints"
  hide-identity: yes
  hide-version: yes
  cache-min-ttl: 300

forward-zone:
  name: "."
  forward-addr: 178.22.122.101
  forward-addr: 185.51.200.1
