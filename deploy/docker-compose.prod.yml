# name: asha-shop
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER:-ashauser}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashapass}
    #   POSTGRES_DB: ${POSTGRES_DB:-ashadb}
    env_file:
      - /opt/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: asha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - /opt/.env
    volumes:
      - ../app/static/uploads:/app/app/static/uploads
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  nginx:
    image: nginx:alpine
    container_name: asha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/static:/app/app/static:ro
      - ./ssl:/etc/ssl/certs:ro

volumes:
  postgres_data:
    name: asha_postgres_data