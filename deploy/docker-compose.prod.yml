# name: asha-shop
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    env_file:
      - /opt/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built on the VPS (Docker Hub + apt + pip accessible). Immutable image;
    # code changes = git pull + `up -d --build`. Uploads persist on host.
    image: asha-shop-app:v1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: asha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - /opt/.env
    volumes:
      - ../app/static/uploads:/app/app/static/uploads
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  nginx:
    image: nginx:alpine
    container_name: asha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/static:/app/app/static:ro
      - ./ssl:/etc/ssl/certs:ro

  db_backup:
    # pg_dump + awscli are baked into the shared image. Script + local dumps
    # live in deploy/backup on the VPS (bind-mounted, stays on disk).
    image: asha-shop-app:v1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: asha-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /opt/.env
    volumes:
      - ./backup:/app/backup
    command: >
      sh -c "
        /app/backup/backup_to_s3.sh || true;
        while true; do sleep 86400; /app/backup/backup_to_s3.sh || true; done
      "
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: asha_postgres_data