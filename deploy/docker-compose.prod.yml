# name: asha-shop
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    env_file:
      - /opt/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Code is bind-mounted from the git checkout, so `git pull` syncs the
    # running app (restart/recreate the container to reload, no rebuild).
    # A rebuild is only needed when requirements.txt / Dockerfile change.
    image: asha-shop-app:v1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: asha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - /opt/.env
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'
      "

  nginx:
    image: nginx:alpine
    container_name: asha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/static:/app/app/static:ro
      - ./ssl:/etc/ssl/certs:ro

  db_backup:
    # pg_dump + awscli are baked into the shared image. Script + local dumps
    # live in deploy/backup on the VPS (bind-mounted, stays on disk).
    image: asha-shop-app:v1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: asha-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /opt/.env
    volumes:
      - ./backup:/app/backup
    command: >
      sh -c "
        /app/backup/backup_to_s3.sh || true;
        while true; do sleep 86400; /app/backup/backup_to_s3.sh || true; done
      "
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Mailu 2.0 mail server for hamdoos.ir ──
  # Web UI (admin + webmail) is served through asha-nginx
  # (mail.hamdoos.ir → front:80); mail ports are published directly.
  # Service names are stock Mailu names — internal configs resolve them.
  # Secrets live in VPS-only /opt/mailu.env (NOT in git).
  # Data lives in VPS-only /opt/mailu (bind mounts, survives rebuilds).
  redis:
    image: redis:alpine
    container_name: mailu-redis
    restart: unless-stopped
    volumes:
      - /opt/mailu/redis:/data
    depends_on:
      - resolver
    dns:
      - 172.19.0.53

  resolver:
    image: ghcr.io/mailu/unbound:2.0
    container_name: mailu-resolver
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    networks:
      default:
        ipv4_address: 172.19.0.53

  front:
    image: ghcr.io/mailu/nginx:2.0
    container_name: mailu-front
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "127.0.0.1:8080:80"
    volumes:
      - /opt/mailu/certs:/certs
    depends_on:
      - redis
      - resolver
    dns:
      - 172.19.0.53

  admin:
    image: ghcr.io/mailu/admin:2.0
    container_name: mailu-admin
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    volumes:
      - /opt/mailu/data:/data
      - /opt/mailu/dkim:/dkim
    depends_on:
      - redis
      - resolver
    dns:
      - 172.19.0.53

  imap:
    image: ghcr.io/mailu/dovecot:2.0
    container_name: mailu-imap
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    volumes:
      - /opt/mailu/mail:/mail
    depends_on:
      - front
      - resolver
    dns:
      - 172.19.0.53

  smtp:
    image: ghcr.io/mailu/postfix:2.0
    container_name: mailu-postfix
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    volumes:
      - /opt/mailu/mailqueue:/queue
    depends_on:
      - front
      - resolver
    dns:
      - 172.19.0.53

  antispam:
    image: ghcr.io/mailu/rspamd:2.0
    container_name: mailu-antispam
    hostname: antispam
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    volumes:
      - /opt/mailu/filter:/var/lib/rspamd
    depends_on:
      - front
      - redis
      - resolver
    dns:
      - 172.19.0.53

  webmail:
    image: ghcr.io/mailu/webmail:2.0
    container_name: mailu-webmail
    restart: unless-stopped
    env_file:
      - /opt/mailu.env
    volumes:
      - /opt/mailu/webmail:/data
    depends_on:
      - front
      - resolver
    dns:
      - 172.19.0.53

volumes:
  postgres_data:
    name: asha_postgres_data