# One-off migrator stack — extends the prod DB, adds a disposable migrator.
#
# This file is intentionally separate from deploy/docker-compose.prod.yml.
# Both use the SAME image as the prod app (`asha-shop-app:v1`, which has the
# ODBC/FreeTDS stack baked in). On the VPS (Docker Hub + apt + pip accessible)
# it is BUILT here, then used for the one-off migration:
#
#   1. docker compose -f docker-compose.migrate.yml build migrator
#   2. docker compose -f docker-compose.migrate.yml up -d db
#   3. docker compose -f docker-compose.migrate.yml run --rm migrator sh -c "alembic upgrade head"
#   4. docker compose -f docker-compose.migrate.yml run --rm migrator --plan
#   5. docker compose -f docker-compose.migrate.yml run --rm migrator
#   6. docker compose -f docker-compose.migrate.yml run --rm migrator --set-admin-pass "NEW_PASS" --admin-user "admin@yourdomain.com"
#   7. docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# After migration you can safely:
#   docker compose -f docker-compose.migrate.yml down

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asha-db
    restart: unless-stopped
    env_file:
      - /opt/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrator:
    image: asha-shop-app:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asha-migrator
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /opt/.env
    environment:
      # Target (PostgreSQL) — inside compose network, host is `db`, not localhost.
      # These override the script's fallback chain: MIG_TARGET_* > POSTGRES_*.
      MIG_TARGET_HOST: db
      MIG_TARGET_PORT: 5432
      # Source (SQL Server) — READ-ONLY SELECT only (see the migration script).
      # Credentials are NEVER hardcoded here. Set MIG_SRC_HOST / MIG_SRC_DATABASE /
      # MIG_SRC_USER / MIG_SRC_PASSWORD / MIG_SRC_SCHEMA in /opt/.env (env_file
      # injects them into the container; the script requires them).
      MIG_SRC_DRIVER: ${MIG_SRC_DRIVER:-FreeTDS}
    volumes:
      - ./alembic/versions:/app/alembic/versions
    # Default: run the migration (args are passed via `run --rm migrator --plan`, etc.)
    entrypoint: ["python", "migrate_sqlserver_to_postgres.py"]
    command: ["--help"]
    restart: "no"

volumes:
  postgres_data:
    name: asha_postgres_data