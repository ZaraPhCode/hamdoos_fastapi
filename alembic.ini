[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime by alembic/env.py from app.config.settings
# (reads .env then /opt/.env, builds DATABASE_URL from POSTGRES_*).
# Keep a harmless default so `alembic` CLI works even without env.
sqlalchemy.url = postgresql://ashauser:ashapass@db:5432/ashadb

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
